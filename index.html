<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Xtikgram Downloader - Premium Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            position: relative;
        }

        /* --- ANIMASI BACKGROUND RGB BERJALAN --- */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out alternate;
            z-index: -1;
        }
        .orb-cyan { width: 45vw; height: 45vw; background: hsla(189, 100%, 70%, 0.8); top: -10%; left: -10%; animation-delay: 0s; }
        .orb-pink { width: 55vw; height: 55vw; background: hsla(340, 100%, 80%, 0.8); bottom: -10%; right: -15%; animation-delay: -5s; }
        .orb-orange { width: 40vw; height: 40vw; background: hsla(28, 100%, 75%, 0.8); top: 30%; left: 30%; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(15vw, -10vh) scale(1.1); }
            66% { transform: translate(-10vw, 15vh) scale(0.9); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* --- MAIN CONTAINER --- */
        .app-container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px 20px 120px 20px;
            z-index: 10;
        }

        @media (min-width: 640px) {
            .app-container {
                min-height: 850px;
                border-radius: 40px;
                border: 1px solid rgba(255, 255, 255, 0.8);
                box-shadow: 0 30px 60px rgba(0, 0, 0, 0.1);
                background: rgba(255, 255, 255, 0.3);
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(24px) saturate(120%);
            -webkit-backdrop-filter: blur(24px) saturate(120%);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
        }

        .glass-dock {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(40px) saturate(200%);
            -webkit-backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255,255,255,0.7);
            touch-action: none;
        }

        .pure-liquid-pill {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1), inset 0 2px 4px rgba(255, 255, 255, 1);
            width: 32%;
            transition: transform 0.45s cubic-bezier(0.25, 1, 0.5, 1), 
                        left 0.45s cubic-bezier(0.25, 1, 0.5, 1),
                        width 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .pill-squish {
            width: 38% !important; 
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15), inset 0 2px 4px rgba(255, 255, 255, 1);
        }

        .ios-active:active {
            transform: scale(0.92);
            transition: transform 0.1s ease;
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.15); border-radius: 4px; }
    </style>
</head>
<body>

    <div class="bg-orb orb-cyan"></div>
    <div class="bg-orb orb-pink"></div>
    <div class="bg-orb orb-orange"></div>

    <div class="app-container">
        <header class="w-full text-center py-3 z-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-orange-400 to-amber-500 shadow-lg shadow-orange-500/30 mb-3 relative">
                <i class="fa-brands fa-tiktok text-3xl text-white drop-shadow-[1px_1px_0px_rgba(0,0,0,0.3)]"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-slate-800">Xtikgram</h1>
            <p class="text-[10px] text-slate-500 mt-1 font-bold tracking-wider">ALL IN ONE HD DOWNLOADER</p>
        </header>

        <main class="w-full my-auto z-10 relative overflow-x-hidden py-2">
            <div id="tabSlider" class="flex w-[300%] items-start transition-transform duration-500" style="transition-timing-function: cubic-bezier(0.32, 0.72, 0, 1); transform: translateX(0%);">
                
                <!-- TAB 1: HOME -->
                <div class="w-1/3 shrink-0 px-0 sm:px-1 space-y-4">
                    <div class="glass-card rounded-3xl p-5 space-y-4">
                        <!-- 3 PLATFORM BUTTONS -->
                        <div class="grid grid-cols-3 gap-1.5 p-1 bg-white/40 rounded-2xl border border-white/60 shadow-inner">
                            <button onclick="setPlatform('tiktok')" id="platTikTok" class="py-2.5 rounded-xl text-[10px] font-bold flex flex-col items-center justify-center space-y-1 transition-all bg-orange-500 text-white shadow-md ios-active">
                                <i class="fa-brands fa-tiktok text-sm"></i>
                                <span>TikTok</span>
                            </button>
                            <button onclick="setPlatform('instagram')" id="platIg" class="py-2.5 rounded-xl text-[10px] font-bold flex flex-col items-center justify-center space-y-1 transition-all text-slate-500 hover:text-slate-800 ios-active">
                                <i class="fa-brands fa-instagram text-sm"></i>
                                <span>Instagram</span>
                            </button>
                            <button onclick="setPlatform('youtube')" id="platYt" class="py-2.5 rounded-xl text-[10px] font-bold flex flex-col items-center justify-center space-y-1 transition-all text-slate-500 hover:text-slate-800 ios-active">
                                <i class="fa-brands fa-youtube text-sm"></i>
                                <span>YouTube</span>
                            </button>
                        </div>

                        <div class="space-y-2">
                            <label id="inputLabel" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider">Paste Link TikTok Disini</label>
                            <div class="relative">
                                <!-- AUTO PASTE BUTTON -->
                                <button onclick="autoPaste()" title="Paste otomatis dari clipboard" class="absolute inset-y-0 left-0 pl-3.5 pr-2 flex items-center text-slate-400 hover:text-orange-500 transition-colors ios-active z-10 cursor-pointer">
                                    <i class="fa-solid fa-clipboard-list text-sm"></i>
                                </button>
                                
                                <input type="text" id="urlInput" placeholder="https://vt.tiktok.com/..." class="w-full pl-10 pr-10 py-3.5 bg-white/60 border border-white/80 rounded-2xl text-xs focus:outline-none focus:border-orange-400 focus:ring-2 focus:ring-orange-400/50 transition text-slate-800 placeholder-slate-400 shadow-sm">
                                
                                <button onclick="clearInput()" id="clearBtn" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-700 hidden ios-active z-10 cursor-pointer">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        </div>

                        <button onclick="processDownload()" id="actionBtn" class="w-full py-3.5 px-4 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold rounded-2xl shadow-lg shadow-orange-500/30 transition flex items-center justify-center space-x-2 text-xs ios-active">
                            <i class="fa-solid fa-bolt"></i>
                            <span id="btnText">Proses Konten</span>
                        </button>
                    </div>

                    <div id="loadingBox" class="text-center py-6 hidden">
                        <div class="inline-block w-7 h-7 border-3 border-orange-500 border-t-transparent rounded-full animate-spin"></div>
                        <p id="loadingText" class="text-xs font-semibold text-slate-600 mt-2">Menghubungkan ke server...</p>
                    </div>
                </div>

                <!-- TAB 2: DOWNLOAD -->
                <div class="w-1/3 shrink-0 px-0 sm:px-1 space-y-4">
                    <div class="glass-card rounded-3xl p-5 space-y-4 border border-orange-400/20">
                        <div class="flex items-center space-x-3">
                            <img id="mediaThumb" src="" alt="Thumbnail" class="w-16 h-20 object-cover rounded-xl bg-white shadow-sm border border-white">
                            <div class="overflow-hidden flex-1">
                                <p id="mediaAuthor" class="text-xs font-bold text-orange-600 truncate">@kinn</p>
                                <p id="mediaDesc" class="text-[11px] text-slate-600 line-clamp-2 mt-1 font-medium">Konten siap diunduh</p>
                            </div>
                        </div>
                        <div id="downloadActionList" class="space-y-2 pt-1 max-h-64 overflow-y-auto pr-1"></div>
                    </div>
                    <p class="text-center text-[10px] font-semibold text-slate-500">Geser dock ke Home untuk link baru.</p>
                </div>

                <!-- TAB 3: ABOUT -->
                <div class="w-1/3 shrink-0 px-0 sm:px-1 space-y-4">
                    <div class="glass-card rounded-3xl p-6 space-y-4 text-center">
                        <div class="w-14 h-14 mx-auto rounded-2xl bg-orange-100 border border-orange-200 flex items-center justify-center text-orange-500 text-2xl shadow-inner">
                            <i class="fa-solid fa-shield-halved"></i>
                        </div>
                        <div>
                            <h2 class="text-base font-bold text-slate-800">Xtikgram Downloader</h2>
                            <p class="text-xs text-slate-600 mt-1 font-medium leading-relaxed">
                                Engine eksklusif untuk bahan editan JJ tanpa watermark. Desain Pure Liquid Glass + Animated RGB.
                            </p>
                        </div>
                        <div class="pt-2 border-t border-slate-200/50">
                            <p class="text-xs font-bold text-slate-500 mb-2">Developer:</p>
                            <a href="https://instagram.com/kinn" target="_blank" class="inline-flex items-center space-x-2 py-2.5 px-5 rounded-xl bg-gradient-to-r from-pink-500 via-orange-500 to-amber-500 text-white text-xs font-bold shadow-lg shadow-orange-500/20 ios-active">
                                <i class="fa-brands fa-instagram text-sm"></i>
                                <span>Instagram: @kinn</span>
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <!-- DOCK BAR PURE LIQUID GLASS -->
        <nav id="dockContainer" class="absolute bottom-6 left-5 right-5 max-w-[340px] mx-auto glass-dock rounded-full p-1.5 z-50 flex items-center justify-around select-none">
            <div id="dockIndicator" class="absolute top-1.5 bottom-1.5 pure-liquid-pill rounded-full pointer-events-none left-[2%] z-0"></div>

            <button onclick="switchTab('home')" id="navHome" class="relative z-10 w-[32%] py-3 flex flex-col items-center justify-center text-orange-600 transition-all ios-active">
                <i class="fa-solid fa-house text-sm"></i>
                <span class="text-[10px] font-bold mt-0.5">Home</span>
            </button>

            <button onclick="switchTab('download')" id="navDownload" class="relative z-10 w-[32%] py-3 flex flex-col items-center justify-center text-slate-500 transition-all ios-active opacity-50 cursor-not-allowed">
                <i class="fa-solid fa-cloud-arrow-down text-sm"></i>
                <span class="text-[10px] font-bold mt-0.5">Download</span>
            </button>

            <button onclick="switchTab('about')" id="navAbout" class="relative z-10 w-[32%] py-3 flex flex-col items-center justify-center text-slate-500 transition-all ios-active">
                <i class="fa-solid fa-circle-info text-sm"></i>
                <span class="text-[10px] font-bold mt-0.5">About</span>
            </button>
        </nav>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        let currentPlatform = 'tiktok';
        let isDataReady = false;
        let currentTabIdx = 0; 

        const urlInput = document.getElementById('urlInput');
        const clearBtn = document.getElementById('clearBtn');
        const loadingBox = document.getElementById('loadingBox');
        const loadingText = document.getElementById('loadingText');
        const tabSlider = document.getElementById('tabSlider');
        
        const navHome = document.getElementById('navHome');
        const navDownload = document.getElementById('navDownload');
        const navAbout = document.getElementById('navAbout');
        const dockIndicator = document.getElementById('dockIndicator');
        const dockContainer = document.getElementById('dockContainer');

        urlInput.addEventListener('input', () => {
            if (urlInput.value.length > 0) clearBtn.classList.remove('hidden');
            else clearBtn.classList.add('hidden');
        });

        function clearInput() {
            urlInput.value = '';
            clearBtn.classList.add('hidden');
        }

        async function autoPaste() {
            try {
                const text = await navigator.clipboard.readText();
                if(text) {
                    urlInput.value = text;
                    clearBtn.classList.remove('hidden');
                }
            } catch (err) {
                alert('Gagal paste otomatis. Pastikan HP lu ngasih izin akses clipboard ke web ini!');
            }
        }

        function setPlatform(plat) {
            currentPlatform = plat;
            const btnTiktok = document.getElementById('platTikTok');
            const btnIg = document.getElementById('platIg');
            const btnYt = document.getElementById('platYt');
            const inputLabel = document.getElementById('inputLabel');

            [btnTiktok, btnIg, btnYt].forEach(btn => {
                btn.className = "py-2.5 rounded-xl text-[10px] font-bold flex flex-col items-center justify-center space-y-1 transition-all text-slate-500 hover:text-slate-800 ios-active";
            });

            if (plat === 'tiktok') {
                btnTiktok.className = "py-2.5 rounded-xl text-[10px] font-bold flex flex-col items-center justify-center space-y-1 transition-all bg-orange-500 text-white shadow-md ios-active";
                inputLabel.innerText = "Paste Link TikTok Disini";
                urlInput.placeholder = "https://vt.tiktok.com/...";
            } else if (plat === 'instagram') {
                btnIg.className = "py-2.5 rounded-xl text-[10px] font-bold flex flex-col items-center justify-center space-y-1 transition-all bg-orange-500 text-white shadow-md ios-active";
                inputLabel.innerText = "Paste Link Instagram (Reels/Foto)";
                urlInput.placeholder = "https://www.instagram.com/p/...";
            } else if (plat === 'youtube') {
                btnYt.className = "py-2.5 rounded-xl text-[10px] font-bold flex flex-col items-center justify-center space-y-1 transition-all bg-red-600 text-white shadow-md ios-active";
                inputLabel.innerText = "Paste Link YouTube Disini";
                urlInput.placeholder = "https://youtu.be/...";
            }
        }

        function switchTab(tabName) {
            let targetIdx = 0;
            if (tabName === 'download') targetIdx = 1;
            if (tabName === 'about') targetIdx = 2;

            if (targetIdx === 1 && !isDataReady) {
                alert('Silakan proses konten terlebih dahulu!');
                return;
            }

            currentTabIdx = targetIdx;
            updateTabDisplay();
        }

        function updateTabDisplay() {
            [navHome, navDownload, navAbout].forEach(nav => {
                nav.classList.remove('text-orange-600');
                nav.classList.add('text-slate-500');
            });

            let targetTranslate = '0%';

            if (currentTabIdx === 0) {
                navHome.classList.remove('text-slate-500');
                navHome.classList.add('text-orange-600');
                dockIndicator.style.left = '2%';
                targetTranslate = '0%';
            } else if (currentTabIdx === 1) {
                navDownload.classList.remove('text-slate-500');
                navDownload.classList.add('text-orange-600');
                dockIndicator.style.left = '34%';
                targetTranslate = '-33.333%';
            } else if (currentTabIdx === 2) {
                navAbout.classList.remove('text-slate-500');
                navAbout.classList.add('text-orange-600');
                dockIndicator.style.left = '66%';
                targetTranslate = '-66.666%';
            }

            tabSlider.style.transform = `translateX(${targetTranslate})`;
        }

        let startX = 0, currentX = 0, isDragging = false;
        dockContainer.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
            dockIndicator.classList.add('pill-squish'); 
            dockIndicator.style.transition = 'width 0.3s cubic-bezier(0.25, 1, 0.5, 1), left 0s';
        });
        dockContainer.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            currentX = e.touches[0].clientX;
            let diffX = currentX - startX;
            let baseLeft = currentTabIdx === 0 ? 2 : (currentTabIdx === 1 ? 34 : 66);
            let movePercent = (diffX / dockContainer.offsetWidth) * 100;
            let newPos = baseLeft + movePercent;
            if (newPos < -2) newPos = -2;
            if (newPos > 68) newPos = 68;
            dockIndicator.style.left = newPos + '%';
        });
        dockContainer.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            dockIndicator.classList.remove('pill-squish');
            dockIndicator.style.transition = 'all 0.45s cubic-bezier(0.25, 1, 0.5, 1)';
            
            let diffX = e.changedTouches[0].clientX - startX;
            if (diffX > 30) {
                if (currentTabIdx === 0) currentTabIdx = isDataReady ? 1 : 2;
                else if (currentTabIdx === 1) currentTabIdx = 2;
            } else if (diffX < -30) {
                if (currentTabIdx === 2) currentTabIdx = isDataReady ? 1 : 0;
                else if (currentTabIdx === 1) currentTabIdx = 0;
            }
            if (currentTabIdx === 1 && !isDataReady) currentTabIdx = diffX > 30 ? 2 : 0;
            updateTabDisplay();
        });

        async function forceDownloadName(url, prefix, ext, btnElement) {
            const originalContent = btnElement.innerHTML;
            btnElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Mengunduh...</span>`;
            
            try {
                const randomId = Math.floor(1000 + Math.random() * 9000);
                const fileName = `${prefix}_${randomId}.${ext}`;

                const response = await fetch(url);
                if (!response.ok) throw new Error("CORS Block");
                
                const blob = await response.blob();
                const blobUrl = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            } catch (err) {
                console.log("CORS block, membuka di tab baru...");
                window.open(url, '_blank');
            } finally {
                btnElement.innerHTML = originalContent;
            }
        }

        async function processDownload() {
            const url = urlInput.value.trim();
            if (!url) {
                alert('Patenkan linknya dulu bro!');
                return;
            }

            loadingBox.classList.remove('hidden');
            loadingText.innerText = "Mengekstrak data dari server...";
            const actionList = document.getElementById('downloadActionList');
            actionList.innerHTML = '';

            try {
                // ================= TIKTOK =================
                if (currentPlatform === 'tiktok') {
                    const res = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
                    const json = await res.json();

                    if (json.code === 0 && json.data) {
                        const data = json.data;
                        document.getElementById('mediaThumb').src = data.cover || 'https://via.placeholder.com/150';
                        document.getElementById('mediaAuthor').innerText = `@${data.author?.unique_id || 'tiktok_user'}`;
                        document.getElementById('mediaDesc').innerText = data.title || 'TikTok Content (No Watermark)';

                        if (data.images && data.images.length > 0) {
                            data.images.forEach((img, idx) => {
                                actionList.innerHTML += `<button onclick="forceDownloadName('${img}', 'Xtik', 'jpg', this)" class="w-full py-2.5 px-4 bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs rounded-xl text-center transition flex items-center justify-center space-x-2 shadow-md ios-active"><i class="fa-solid fa-image"></i><span>Download Foto ${idx + 1} (Xtik)</span></button>`;
                            });
                        } else {
                            actionList.innerHTML = `
                                <button onclick="forceDownloadName('${data.play}', 'Xtik', 'mp4', this)" class="w-full py-3 px-4 bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs rounded-xl text-center transition flex items-center justify-center space-x-2 shadow-md ios-active"><i class="fa-solid fa-video"></i><span>Download Video HD (Xtik)</span></button>
                                <a href="${data.music}" target="_blank" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl text-center transition flex items-center justify-center space-x-2 shadow-md ios-active"><i class="fa-solid fa-music"></i><span>Download Audio MP3</span></a>
                            `;
                        }
                    } else { throw new Error('Link TikTok tidak valid.'); }
                } 
                
                // ================= INSTAGRAM =================
                else if (currentPlatform === 'instagram') {
                    loadingText.innerText = "Menembus server Instagram...";
                    let success = false, igData = null;

                    const igApis = [
                        `https://api.ryzendesu.vip/api/downloader/igdl?url=${encodeURIComponent(url)}`,
                        `https://api.vreden.web.id/api/igdownload?url=${encodeURIComponent(url)}`,
                        `https://api.siputzx.my.id/api/d/igdl?url=${encodeURIComponent(url)}`
                    ];

                    for (let endpoint of igApis) {
                        try {
                            const res = await fetch(endpoint);
                            const json = await res.json();
                            if ((json.data && json.data.length > 0) || (json.result && json.result.length > 0)) {
                                igData = json;
                                success = true;
                                break; 
                            }
                        } catch (err) {}
                    }

                    if (success && igData) {
                        let mediaItems = Array.isArray(igData.data) ? igData.data : (Array.isArray(igData.result) ? igData.result : [igData.url]);
                        let firstThumb = mediaItems[0].url || mediaItems[0].thumbnail || mediaItems[0];

                        document.getElementById('mediaThumb').src = firstThumb || 'https://via.placeholder.com/150';
                        document.getElementById('mediaAuthor').innerText = `@instagram_user`;
                        document.getElementById('mediaDesc').innerText = 'Instagram Reels / Foto';

                        mediaItems.forEach((item, idx) => {
                            let mediaUrl = item.url || item;
                            let isVideo = mediaUrl.includes('.mp4') || mediaUrl.includes('video') || url.includes('/reel/');
                            let label = isVideo ? `Download Video ${mediaItems.length > 1 ? idx + 1 : ''}` : `Download Foto ${mediaItems.length > 1 ? idx + 1 : ''}`;
                            let icon = isVideo ? 'fa-video' : 'fa-image';
                            let ext = isVideo ? 'mp4' : 'jpg';
                            
                            actionList.innerHTML += `
                                <button onclick="forceDownloadName('${mediaUrl}', 'xinsta', '${ext}', this)" class="w-full py-3 px-4 bg-orange-500 hover:bg-orange-600 text-white font-bold text-xs rounded-xl text-center transition flex items-center justify-center space-x-2 shadow-md ios-active">
                                    <i class="fa-solid ${icon}"></i>
                                    <span>${label} (xinsta)</span>
                                </button>
                            `;
                        });
                    } else { throw new Error('Semua server Instagram Publik sedang diblokir Cloudflare. Coba 10 detik lagi.'); }
                }

                // ================= YOUTUBE (FIXED LENGKAP) =================
                else if (currentPlatform === 'youtube') {
                    loadingText.innerText = "Mengekstrak resolusi YouTube...";
                    
                    // AUTO-CONVERT LINK youtu.be ke format standar biar server gak pusing
                    let cleanYtUrl = url;
                    if (cleanYtUrl.includes('youtu.be/')) {
                        const vidId = cleanYtUrl.split('youtu.be/')[1].split('?')[0];
                        cleanYtUrl = `https://www.youtube.com/watch?v=${vidId}`;
                    }

                    let ytData = null;

                    // SERVER 1: API Siputzx
                    try {
                        let res = await fetch(`https://api.siputzx.my.id/api/d/ytmp4?url=${encodeURIComponent(cleanYtUrl)}`);
                        let json = await res.json();
                        if (json.data && json.data.dl) {
                            ytData = {
                                title: json.data.title || 'YouTube Video',
                                thumb: 'https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg',
                                videoUrl: json.data.dl,
                                audioUrl: null
                            };
                        }
                    } catch(e) {}

                    // SERVER 2: API Vreden (Jika Siputzx gagal)
                    if (!ytData) {
                        try {
                            let res = await fetch(`https://api.vreden.web.id/api/ytmp4?url=${encodeURIComponent(cleanYtUrl)}`);
                            let json = await res.json();
                            if (json.result && json.result.download && json.result.download.url) {
                                 ytData = {
                                    title: json.result.title || 'YouTube Video',
                                    thumb: json.result.thumbnail || 'https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg',
                                    videoUrl: json.result.download.url,
                                    audioUrl: null
                                 };
                            }
                        } catch(e) {}
                    }

                    // SERVER 3: API Ryzendesu (Lapis Terakhir)
                    if (!ytData) {
                         try {
                            let res = await fetch(`https://api.ryzendesu.vip/api/downloader/ytmp4?url=${encodeURIComponent(cleanYtUrl)}`);
                            let json = await res.json();
                            if (json.url) {
                                 ytData = {
                                    title: json.title || 'YouTube Video',
                                    thumb: json.thumbnail || 'https://upload.wikimedia.org/wikipedia/commons/b/b8/YouTube_Logo_2017.svg',
                                    videoUrl: json.url,
                                    audioUrl: null
                                 };
                            }
                        } catch(e) {}
                    }

                    // Kalau Video udah tembus, coba tarik Audio-nya juga pakai Siputzx
                    try {
                        if (ytData) {
                             let audRes = await fetch(`https://api.siputzx.my.id/api/d/ytmp3?url=${encodeURIComponent(cleanYtUrl)}`);
                             let audJson = await audRes.json();
                             if (audJson.data && audJson.data.dl) ytData.audioUrl = audJson.data.dl;
                        }
                    } catch(e) {}

                    if (ytData && ytData.videoUrl) {
                        document.getElementById('mediaThumb').src = ytData.thumb;
                        document.getElementById('mediaAuthor').innerText = `@youtube_creator`;
                        document.getElementById('mediaDesc').innerText = ytData.title;

                        actionList.innerHTML += `
                            <a href="${ytData.videoUrl}" target="_blank" class="w-full py-3 px-4 bg-red-600 hover:bg-red-700 text-white font-bold text-xs rounded-xl text-center transition flex items-center justify-center space-x-2 shadow-md ios-active">
                                <i class="fa-solid fa-video"></i>
                                <span>Download Video MP4 (HD)</span>
                            </a>
                        `;
                        if (ytData.audioUrl) {
                            actionList.innerHTML += `
                                <a href="${ytData.audioUrl}" target="_blank" class="w-full py-3 px-4 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl text-center transition flex items-center justify-center space-x-2 shadow-md ios-active">
                                    <i class="fa-solid fa-music"></i>
                                    <span>Download Audio MP3 Saja</span>
                                </a>
                            `;
                        }
                    } else { throw new Error('Gagal mengekstrak YouTube. Pastikan link benar & bukan video private.'); }
                }

                isDataReady = true;
                navDownload.classList.remove('opacity-50', 'cursor-not-allowed');
                currentTabIdx = 1;
                updateTabDisplay();

            } catch (error) {
                console.error(error);
                alert(error.message || 'Gagal tersambung ke server. Periksa link lu.');
            } finally {
                loadingBox.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
